[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sys1npc"
version = "0.1.0"
description = "A small, mechanics-free decision core for game NPCs — the foundation for a FireRed trainer-battle AI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Safiullah Rattar" }]
keywords = ["ai", "agents", "npc", "gamedev", "decisions", "pokemon", "emulation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/SafiullahRattar/sys1npc"

[tool.hatch.build.targets.wheel]
packages = ["src/sys1npc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
